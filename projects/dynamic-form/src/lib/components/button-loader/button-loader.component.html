<button (click)="onClick()" [type]="type" [disabled]="!isFormValid||loadSpinner||loadCheck" [class]="'btn btn-'+color+' '+button_type" [ngClass]="{'mr-1':margin,'circular':circular,'btn-expand':expand,'btn-lg':large}">
  @if (!loadSpinner && !loadCheck) {
    <a class="d-flex align-items-center" [style]="'color: '+getTextColor()">
      @if (icon!='' && icon_position=='left') {
        <i [class]="getClassFromIcon()+' fs-20 '+(text ? 'mr-1' : '')"></i>
      }
      <span>{{text}}</span>
      @if (icon!='' && icon_position=='right') {
        <i [class]="getClassFromIcon()+' fs-20'"></i>
      }
    </a>
  }
  @if (loadCheck && !loadSpinner) {
    <i style="font-size: 30px!important;" class="uil uil-check fs-18"></i>
  }
  @if (loadSpinner && !loadCheck) {
    <span id="butt-spinner" class="spinner-border spinner-border-sm"
    role="status" aria-hidden="true"></span>
  }
</button>
